<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Страница не найдена</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #101b2d;
      color: #fff7f0;
      font-family: "Segoe UI", sans-serif;
    }

    main {
      width: min(92vw, 420px);
      padding: 24px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.08);
      text-align: center;
    }

    a {
      color: inherit;
    }
  </style>
  <script>
    (function () {
      var path = window.location.pathname.replace(/\/+$/, "");
      if (path === "/game") {
        window.location.replace("/game/");
      }
    })();
  </script>
</head>
<body>
<main>
  <h1>Страница не найдена</h1>
  <p>Если нужен маршрут к свиданию, открой <a href="/game/">/game/</a>.</p>
  <p><a href="/">Вернуться на главную</a></p>
</main>
</body>
</html>
